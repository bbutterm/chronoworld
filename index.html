<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <title>Chronoworld</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #11131a; overflow: hidden; touch-action: none; }
      #game { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* Безопасные отступы (вырез, «чёлка», полоска жестов) — читает src/game/viewport.ts. */
      #safe-probe {
        position: absolute; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      /* P8: телефон в альбомной ориентации — игра портретная, просим повернуть (T3-01). */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #11131a; color: #f0cf8a; font: bold 22px Arial, "Helvetica Neue", sans-serif;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; box-sizing: border-box;
      }
      #rotate small { color: #b8bcc8; font-weight: normal; font-size: 16px; }
      #rotate .phone {
        width: 44px; height: 76px; border: 4px solid #c8a060; border-radius: 9px; box-sizing: border-box;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }
      @keyframes rotate-hint { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      /*
       * Заставка до первого кадра игры: видна, пока качается и запускается JS (на 3G — секунды). Повторяет экран
       * загрузки BootScene (название, черта, полоса) в тех же пропорциях мира 1080×1920; main.ts убирает её на первом
       * кадре BootScene. Без картинок и шрифтов — рисуется сразу с HTML.
       */
      #splash {
        --u: min(calc(100vw / 1080), calc(100vh / 1920));
        position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #11131a;
        font-family: Arial, "Helvetica Neue", sans-serif; transition: opacity 0.2s;
      }
      #splash.gone { opacity: 0; }
      #splash > * { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; }
      #splash h1 {
        top: calc(50% - 200 * var(--u)); font-size: calc(100 * var(--u)); font-weight: bold; color: #ffe9a8; white-space: nowrap;
        -webkit-text-stroke: calc(8 * var(--u)) #000; paint-order: stroke fill;
      }
      #splash .line { top: calc(50% - 110 * var(--u)); width: calc(460 * var(--u)); height: calc(5 * var(--u)); background: #c8a060; }
      #splash .bar {
        top: calc(50% + 120 * var(--u)); width: calc(760 * var(--u)); height: calc(44 * var(--u)); overflow: hidden;
        border: calc(7 * var(--u)) solid #000; outline: calc(4 * var(--u)) solid #c8a060; outline-offset: calc(-2 * var(--u)); background: #000;
      }
      #splash .bar i {
        position: absolute; top: 0; bottom: 0; width: 30%; background: #e0a82a; opacity: 0.8;
        animation: splash-run 1.4s ease-in-out infinite;
      }
      @keyframes splash-run { from { left: -30%; } to { left: 100%; } }
      #splash p { top: calc(50% + 200 * var(--u)); font-size: calc(42 * var(--u)); color: #fff; white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; left: 35%; } }
      @media (orientation: landscape) and (max-height: 540px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="splash" aria-busy="true"><h1>Chronoworld</h1><div class="line"></div><div class="bar"><i></i></div><p>Загрузка…</p></div>
    <div id="safe-probe"></div>
    <div id="rotate" role="alert"><div class="phone"></div>Поверните телефон<small>Chronoworld играется в вертикальной ориентации</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
