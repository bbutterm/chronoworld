<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0907" />
    <meta name="description" content="Сюжетная idle-RPG: соберите отряд, пройдите 10 глав и развивайте спутников. Башня испытаний, охота на MVP и Арена товарищей." />
    <meta property="og:title" content="Chronoworld" />
    <meta property="og:description" content="10 глав приключений, личные истории героев и отдельная Арена товарищей. Соберите свой отряд и отправляйтесь в путь." />
    <meta property="og:type" content="website" />
    <title>Chronoworld</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314120f'/%3E%3Cpath d='M43 19a19 19 0 1 0 0 26' fill='none' stroke='%23d6a92a' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!--
      Шрифты интерфейса (OFL, assets/fonts, подмножество латиница + кириллица): качаются сразу, параллельно с JS;
      main.ts ждёт их до первой сцены (иначе Phaser.Text запечёт системный шрифт). Список — FONT_FILES в src/game/theme.ts.
      Обычный текст — Rubik 400 (500 рядом с жирным 700 читался тяжёлым): диапазон 300–600 отдан файлу 400.
    -->
    <link rel="preload" href="fonts/rubik-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/rubik-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/philosopher-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Rubik'; font-weight: 300 600; font-display: swap; src: url('fonts/rubik-400.woff2') format('woff2'); }
      @font-face { font-family: 'Rubik'; font-weight: 700 900; font-display: swap; src: url('fonts/rubik-700.woff2') format('woff2'); }
      @font-face { font-family: 'Philosopher'; font-weight: 400 900; font-display: swap; src: url('fonts/philosopher-700.woff2') format('woff2'); }
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0907; overflow: hidden; touch-action: none; }
      #game { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* Безопасные отступы (вырез, «чёлка», полоска жестов) — читает src/game/viewport.ts. */
      #safe-probe {
        position: absolute; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      /* P8: телефон в альбомной ориентации — игра портретная, просим повернуть (T3-01). */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #0a0907; color: #f0cf8a; font: bold 22px Rubik, Arial, "Helvetica Neue", sans-serif;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; box-sizing: border-box;
      }
      #rotate small { color: #b8bcc8; font-weight: normal; font-size: 16px; }
      #rotate .phone {
        width: 44px; height: 76px; border: 4px solid #c8a060; border-radius: 9px; box-sizing: border-box;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }
      @keyframes rotate-hint { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      /*
       * Заставка до первого кадра игры: видна, пока качается и запускается JS (на 3G — секунды). Повторяет экран
       * загрузки BootScene (src/game/bootLook.ts, BOOT и BOOT_COLORS — те же числа и цвета): тёплый полумрак, лента
       * с названием, орнамент, полоса с фаской — в тех же пропорциях мира 1080×1920, по центру безопасной области
       * (как поле игры, viewport.ts). main.ts убирает её на первом кадре BootScene. Без картинок; шрифты — свои, если уже пришли (font-display: swap).
       */
      #splash {
        --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
        --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
        --u: min(calc((100vw - var(--sl) - var(--sr)) / 1080), calc((100vh - var(--st) - var(--sb)) / 1920));
        --cx: calc(var(--sl) + (100vw - var(--sl) - var(--sr)) / 2);
        --cy: calc(var(--st) + (100vh - var(--st) - var(--sb)) / 2);
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(circle calc(1300 * var(--u)) at var(--cx) calc(var(--cy) - 100 * var(--u)), #2b2218 0%, #16130e 45%, #0a0907 100%);
        font-family: Rubik, Arial, "Helvetica Neue", sans-serif; transition: opacity 0.2s;
      }
      #splash.gone { opacity: 0; }
      #splash > * { position: absolute; left: var(--cx); transform: translate(-50%, -50%); margin: 0; }
      #splash .rib {
        top: calc(var(--cy) - 210 * var(--u)); width: calc(820 * var(--u)); height: calc(150 * var(--u));
        --n: calc(46 * var(--u)); --i: calc(5 * var(--u));
        background: linear-gradient(#f0cf8a, #8f6a2c);
        clip-path: polygon(0 0, 100% 0, calc(100% - var(--n)) 50%, 100% 100%, 0 100%, var(--n) 50%);
      }
      #splash .rib::before {
        content: ""; position: absolute; inset: 0; background: linear-gradient(#7a2a1e, #5a1a12 50%, #3a0e0a);
        clip-path: polygon(var(--i) var(--i), calc(100% - var(--i)) var(--i), calc(100% - var(--n) - var(--i) / 2) 50%,
          calc(100% - var(--i)) calc(100% - var(--i)), var(--i) calc(100% - var(--i)), calc(var(--n) + var(--i) / 2) 50%);
      }
      #splash h1 {
        top: calc(var(--cy) - 212 * var(--u)); font-size: calc(92 * var(--u)); line-height: 1.2; font-weight: bold; color: #ffe9a8;
        white-space: nowrap; -webkit-text-stroke: calc(8 * var(--u)) #1a0806; paint-order: stroke fill;
        text-shadow: 0 calc(4 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, 0.6);
      }
      #splash .orn {
        top: calc(var(--cy) - 100 * var(--u)); width: calc(480 * var(--u)); height: calc(4 * var(--u));
        background: linear-gradient(90deg, rgba(232, 198, 126, 0), rgba(232, 198, 126, 0.9) 50%, rgba(232, 198, 126, 0));
      }
      #splash .orn::before, #splash .orn::after {
        content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg);
        width: calc(24 * var(--u)); height: calc(24 * var(--u)); background: #0a0907;
      }
      #splash .orn::after { width: calc(17 * var(--u)); height: calc(17 * var(--u)); background: #f0cf8a; }
      #splash .bar {
        top: calc(var(--cy) + 120 * var(--u)); width: calc(800 * var(--u)); height: calc(84 * var(--u)); border-radius: calc(42 * var(--u));
        background: linear-gradient(#a8864f, #4a3b25);
      }
      #splash .bar::before {
        content: ""; position: absolute; inset: calc(4 * var(--u)); border-radius: calc(38 * var(--u)); background: #070605;
      }
      #splash .bar b {
        position: absolute; left: calc(20 * var(--u)); top: calc(20 * var(--u)); width: calc(760 * var(--u)); height: calc(44 * var(--u));
        border-radius: calc(22 * var(--u)); overflow: hidden; background: linear-gradient(#0c0b09, #1b1813);
      }
      #splash .bar i {
        position: absolute; top: 0; bottom: 0; width: 30%; border-radius: calc(22 * var(--u));
        background: linear-gradient(#ffe6a6, #d9a54c 50%, #b27a26); animation: splash-run 1.4s ease-in-out infinite;
      }
      @keyframes splash-run { from { left: -30%; } to { left: 100%; } }
      #splash p { top: calc(var(--cy) + 200 * var(--u)); font-size: calc(42 * var(--u)); color: #eadfc6; white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; left: 35%; } }
      @media (orientation: landscape) and (max-height: 540px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="splash" aria-busy="true"><div class="rib"></div><h1>Chronoworld</h1><div class="orn"></div><div class="bar"><b><i></i></b></div><p>Загрузка…</p></div>
    <div id="safe-probe"></div>
    <div id="rotate" role="alert"><div class="phone"></div>Поверните телефон<small>Chronoworld играется в вертикальной ориентации</small></div>
    <script>
      // Telegram Mini App: SDK нужен только внутри Telegram (параметры запуска в hash) — отступы под кнопки Telegram,
      // события свернуть/развернуть. В обычном браузере не грузится.
      if (/tgWebApp/.test(location.hash + location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
